<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartHospital Admin Login — Monitor hospital operations.">
    <title>Admin Login — SmartHospital</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-icon">👨‍💼</div>

        <h1>Admin Login</h1>

        <p>Monitor and manage hospital operations.</p>

        <!-- Error Message -->
        <div id="loginError" class="error-message" style="display:none;"></div>

        <form onsubmit="adminLogin(event)">

            <label for="adminId">Admin ID</label>
            <input
                type="text"
                id="adminId"
                placeholder="Enter Admin ID"
                required
            >

            <label for="adminPassword">Password</label>
            <input
                type="password"
                id="adminPassword"
                placeholder="Enter password"
                required
            >

            <button type="submit" class="login-btn" id="loginBtn">
                Login
            </button>


        </form>

        <div class="demo-hint">
            <p>🔑 <strong>Demo login:</strong></p>
            <p>Admin ID: <code>admin</code></p>
            <p>Password: <code>admin123</code></p>
        </div>

        <p class="back-link">
            <a href="index.html">← Back to Home</a>
        </p>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
