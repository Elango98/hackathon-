<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartHospital Patient Login — Book tokens and track your queue.">
    <title>Patient Login — SmartHospital</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-icon">👤</div>

        <h1>Patient Login</h1>

        <p>Login to manage your appointments and queue.</p>

        <!-- Error Message -->
        <div id="loginError" class="error-message" style="display:none;"></div>

        <form onsubmit="patientLogin(event)">

            <label for="patientEmail">Email / Phone</label>
            <input
                type="text"
                id="patientEmail"
                placeholder="Enter email or phone"
                required
            >

            <label for="patientPassword">Password</label>
            <input
                type="password"
                id="patientPassword"
                placeholder="Enter password"
                required
            >

            <button type="submit" class="login-btn" id="loginBtn">
                Login
            </button>

        </form>

        <div class="demo-hint">
            <p>🔑 <strong>Demo login:</strong></p>
            <p>Email: <code>raj@hospital.com</code></p>
            <p>Password: <code>patient123</code></p>
        </div>

        <p class="back-link">
            <a href="index.html">← Back to Home</a>
        </p>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
